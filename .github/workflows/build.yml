name: Build

on:
  push:
  pull_request:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8'))"
          for f in *.js; do node --check "$f"; done

      - name: Package
        run: |
          version=$(node -p "require('./manifest.json').version")
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "ZIP=shelf-$version.zip" >> "$GITHUB_ENV"
          zip -r "shelf-$version.zip" manifest.json *.html *.js *.css icons/*.png

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP }}
          path: ${{ env.ZIP }}

      # The release tag must match the manifest version: v<version>
      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.release.tag_name }}"
          if [ "$tag" != "v$VERSION" ]; then
            echo "Tag $tag does not match manifest version v$VERSION"; exit 1
          fi
          gh release upload "$tag" "$ZIP" --clobber
